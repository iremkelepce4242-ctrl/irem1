name: Android CI - Supabase Yeni APK Derleme

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Yeni APK Derle ve Paketle (Ayrı Uygulama)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kaynak Kodları Çek
        uses: actions/checkout@v4

      - name: ☕ JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: 🔍 Proje Dizinini Tespit Et
        run: |
          if [ -d "android_project" ]; then
            echo "PROJECT_DIR=android_project" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: ⚙️ Gradle 8.9 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: ${{ env.PROJECT_DIR }}
          cache-read-only: false

      - name: 🆕 Yeni Bağımsız Uygulama Kimliği ve Kodları Onar
        run: |
          PROJ_PATH="${{ env.PROJECT_DIR }}"
          RES_DIR="$PROJ_PATH/app/src/main/res"
          JAVA_DIR="$PROJ_PATH/app/src/main/java/com/irem/takip"
          BUILD_GRADLE="$PROJ_PATH/app/build.gradle.kts"
          
          mkdir -p "$RES_DIR/values" "$RES_DIR/xml" "$RES_DIR/drawable" "$RES_DIR/mipmap-anydpi-v26"
          mkdir -p "$JAVA_DIR"

          # 1. Yeni ve benzersiz paket kimliği tanımla (Eski uygulamayı etkilemez, yan yana kurulur)
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/applicationId = "com.irem.takip"/applicationId = "com.irem.stokcari.supabase"/g' "$BUILD_GRADLE"
          fi

          # 2. Yeni Uygulama Başlığı
          cat << 'EOF' > "$RES_DIR/values/strings.xml"
          <resources>
              <string name="app_name">Stok Takip (Supabase)</string>
              <string name="title_dashboard">Genel Bakış</string>
              <string name="title_cariler">Cari Hesaplar</string>
              <string name="title_stoklar">Stok Yönetimi</string>
              <string name="title_satis">Satış &amp; Fiş</string>
              <string name="title_kasa">Kasa &amp; Tahsilat</string>
              <string name="title_raporlar">Mali Raporlar</string>
          </resources>
          EOF

          # 3. MainActivity Onarımı
          cat << 'EOF' > "$JAVA_DIR/MainActivity.kt"
          package com.irem.takip

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import com.irem.takip.data.repository.CariRepository
          import kotlinx.coroutines.launch

          class MainActivity : AppCompatActivity() {

              private val cariRepository by lazy { CariRepository() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  lifecycleScope.launch {
                      try {
                          val result = cariRepository.getCariler(yil = 2025)
                          result.onSuccess { cariler ->
                              android.util.Log.d("MainActivity", "Cari Sayısı: ${cariler.size}")
                          }
                      } catch (e: Exception) {
                          android.util.Log.e("MainActivity", "Hata: ${e.message}", e)
                      }
                  }
              }
          }
          EOF

          # 4. Tema Onarımı
          cat << 'EOF' > "$RES_DIR/values/themes.xml"
          <resources>
              <style name="Theme.Takip" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="colorPrimary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          # 5. FileProvider Onarımı
          cat << 'EOF' > "$RES_DIR/xml/file_paths.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="my_pdf_docs" path="documents/" />
              <external-path name="external" path="." />
              <cache-path name="cache" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          EOF

          # 6. İkon Dosyaları
          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_background.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#10B981" android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_foreground.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M54,24L30,36v24c0,16.57 10.24,32.08 24,36c13.76-3.92 24-19.43 24-36V36L54,24z M54,48c4.42,0 8,3.58 8,8s-3.58,8-8,8s-8-3.58-8-8S49.58,48 54,48z" />
          </vector>
          EOF

          cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: 🔨 Debug APK Derle (assembleDebug)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 📦 Yeni APK'yı İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: StokTakip-Supabase-Yeni-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
