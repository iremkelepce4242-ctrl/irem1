name: Android CI - APK Derleme

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 🚀 APK Derle ve Paketle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kaynak Kodları Çek
        uses: actions/checkout@v4

      - name: ☕ JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: ⚙️ Gradle 8.9 Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: android_project

      - name: 🔨 Debug APK Derle
        working-directory: android_project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 📦 APK'yı İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: StokTakip-Supabase-APK
          path: android_project/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
